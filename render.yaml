# Render Blueprint: one-click deploy of the API and the React frontend.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: agritwin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false   # set to the frontend URL after the first deploy, e.g. https://agritwin-web.onrender.com

  - type: web
    name: agritwin-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to the API URL, e.g. https://agritwin-api.onrender.com
